# =============================================================================
# configs/evaluation.yaml  — RAG evaluation configuration
# =============================================================================

dataset:
  path: "data/evaluation/rag_questions.jsonl"
  version: "v1"

metrics:
  retrieval:
    - recall_at_k
    - precision_at_k
    - mrr
    - ndcg_at_k
    - retrieval_latency_ms
  generation:
    - answer_relevance
    - groundedness
    - citation_correctness
    - unsupported_claim_rate
  system:
    - retrieval_latency_ms
    - generation_latency_ms
    - total_latency_ms
    - error_rate

k_values: [1, 3, 5, 10]

groundedness:
  method: "overlap"          # "overlap" | "nli" | "llm_judge"
  threshold: 0.75
  min_claim_length: 10       # ignore very short claims

output:
  report_dir: "data/evaluation/reports"
  save_per_question_results: true
  save_aggregated_metrics: true
