# =============================================================================
# configs/retrieval.yaml  — Retrieval method configuration
# =============================================================================

methods:
  tfidf:
    name: "TF-IDF Baseline"
    enabled: true
    params:
      max_features: 10000
      ngram_range: [1, 2]
      sublinear_tf: true
      top_k: 5

  bm25:
    name: "BM25 Candidate-1"
    enabled: true
    params:
      k1: 1.5
      b: 0.75
      top_k: 5

  semantic:
    name: "Semantic Retrieval Candidate-2"
    enabled: true
    params:
      model: "sentence-transformers/all-MiniLM-L6-v2"
      distance_metric: "cosine"
      top_k: 5

  hybrid:
    name: "Hybrid BM25+Semantic"
    enabled: true
    params:
      alpha: 0.5             # 0 = pure BM25, 1 = pure semantic
      top_k: 5
      fusion_method: "rrf"   # "rrf" | "weighted_sum"
      rrf_k: 60
