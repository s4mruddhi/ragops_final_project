# =============================================================================
# RAGOps: params.yaml
# Single source of truth for all pipeline parameters and thresholds.
# Used by: Airflow DAG, retrieval scripts, quality gate, drift detector.
# Do NOT hardcode these values elsewhere — always read from this file.
# =============================================================================

seed: 42   # fixed random seed for reproducibility

# ---------------------------------------------------------------------------
# Document processing
# ---------------------------------------------------------------------------
ingestion:
  supported_extensions: [".pdf", ".docx", ".txt"]
  max_file_size_mb: 50
  min_file_size_bytes: 100

# ---------------------------------------------------------------------------
# Chunking
# ---------------------------------------------------------------------------
chunking:
  chunk_size: 512          # characters
  chunk_overlap: 64        # characters
  min_chunk_size: 50       # reject chunks smaller than this
  max_chunk_size: 1024     # reject chunks larger than this

# ---------------------------------------------------------------------------
# Embedding
# ---------------------------------------------------------------------------
embedding:
  model: "sentence-transformers/all-MiniLM-L6-v2"
  batch_size: 32
  device: "cpu"            # "cpu" | "cuda"

# ---------------------------------------------------------------------------
# Vector database
# ---------------------------------------------------------------------------
vectorstore:
  provider: "chroma"       # "chroma" | "faiss"
  persist_dir: "data/vectorstore"
  collection_name: "ragops_v1"
  distance_metric: "cosine"

# ---------------------------------------------------------------------------
# Retrieval
# ---------------------------------------------------------------------------
retrieval:
  default_method: "semantic"   # overridden at serve time by the MLflow 'champion' alias; "tfidf" | "bm25" | "semantic" | "hybrid"
  top_k: 5
  hybrid_alpha: 0.5            # weight for semantic in hybrid (0=BM25, 1=semantic)
  score_threshold: 0.0         # minimum similarity score to include chunk

# ---------------------------------------------------------------------------
# RAG generation
# ---------------------------------------------------------------------------
generation:
  prompt_version: "answer_v1"
  fallback_prompt_version: "fallback_v1"
  max_context_chunks: 5
  max_answer_tokens: 512
  groundedness_threshold: 0.75   # below this → fallback response
  temperature: 0.0               # deterministic

# ---------------------------------------------------------------------------
# Quality gate thresholds
# ---------------------------------------------------------------------------
quality_gate:
  min_recall_at_5: 0.70
  min_precision_at_5: 0.55
  min_mrr: 0.65
  min_groundedness: 0.75
  min_citation_correctness: 0.80
  min_abstention_rate: 0.30      # known limitation: extractive generator; raise when an LLM is configured
  max_retrieval_latency_ms: 500
  max_generation_latency_ms: 4500
  max_total_latency_ms: 5000
  require_all_tests_pass: true

# ---------------------------------------------------------------------------
# Evaluation
# ---------------------------------------------------------------------------
evaluation:
  dataset_path: "data/evaluation/rag_questions.jsonl"
  k_values: [1, 3, 5, 10]
  sagemaker_input_prefix: "evaluation/input"
  sagemaker_output_prefix: "evaluation/output"

# ---------------------------------------------------------------------------
# Drift detection
# ---------------------------------------------------------------------------
drift:
  method: "psi"              # "psi" | "ks"
  psi_threshold: 0.2         # PSI > 0.2 → significant drift
  ks_p_value_threshold: 0.05 # p < 0.05 → drift
  reference_window_days: 7
  current_window_days: 1
  min_samples: 30            # minimum queries per window

# ---------------------------------------------------------------------------
# Dataset versions (updated when new docs added)
# ---------------------------------------------------------------------------
dataset:
  current_version: "v1"
  document_count_v1: 20
  document_count_v2: 25

# ---------------------------------------------------------------------------
# MLflow
# ---------------------------------------------------------------------------
mlflow:
  experiment_name: "ragops-retrieval"
  registered_model_name: "ragops-retrieval-config"
  artifact_path: "retrieval_config"

  model_alias: "champion"
  baseline_method: "tfidf"      # the baseline; others are candidates
