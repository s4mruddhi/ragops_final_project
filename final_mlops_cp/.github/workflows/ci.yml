name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  PYTHONHASHSEED: "42"
  ANONYMIZED_TELEMETRY: "False"

jobs:
  test-and-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Cache HuggingFace model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: "Pull versioned data with DVC (remote is the in-repo .dvc_local_remote)"
        run: |
          pip install dvc
          dvc pull data/raw.dvc

      - name: Lint (syntax / undefined names)
        run: |
          pip install flake8
          flake8 app scripts dags tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Unit + integration tests
        env:
          EMBEDDER_STRICT: "1"   # CI must use the real embedding model, never the offline fallback
        run: pytest tests -q --cov=app --cov-report=term-missing --cov-fail-under=60

      - name: Run full pipeline (ingest -> ... -> register)
        env:
          EMBEDDER_STRICT: "1"
        run: python scripts/run_dag_pipeline.py

      - name: Model-quality threshold before promotion
        run: |
          python - <<'PY'
          import json, sys
          g = json.load(open("data/evaluation/reports/quality_gate.json"))
          for k, v in g["checks"].items():
              print(f"{k:24s} {v['value']:>10} (threshold {v['threshold']}) {'PASS' if v['pass'] else 'FAIL'}")
          sys.exit(0 if g["passed"] else 1)
          PY

      - name: Upload evaluation reports
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-reports
          path: |
            data/evaluation/reports/
            data/monitoring/drift_report.json

      - name: Upload built data (index, processed, champion) for the Docker job
        uses: actions/upload-artifact@v4
        with:
          name: built-data
          path: |
            data/vectorstore
            data/processed
            data/evaluation
            data/monitoring
            data/raw

  docker-build-and-api-test:
    runs-on: ubuntu-latest
    needs: test-and-quality-gate
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download built data
        uses: actions/download-artifact@v4
        with:
          name: built-data
          path: data

      - name: Docker image build test
        run: docker build -t ragops-api:ci .

      - name: Start container (data mounted as in docker-compose)
        run: |
          docker run -d --name ragops -p 8000:8000 -e ALLOW_TEST_MOCK=1 -v "$PWD/data:/app/data" ragops-api:ci
          for i in $(seq 1 40); do
            curl -sf http://localhost:8000/health && break || sleep 3
          done

      - name: API integration test (health + ask + model-info + query + validation + metrics)
        run: |
          curl -sf http://localhost:8000/health | tee /dev/stderr | grep -q '"status":"healthy"'
          curl -sf http://localhost:8000/model-info | tee /dev/stderr | grep -q '"champion"'
          curl -sf -X POST http://localhost:8000/ask -H 'Content-Type: application/json' \
            -d '{"question":"How many days of annual leave are employees entitled to?"}' | grep -q '"answer"'
          curl -sf -X POST http://localhost:8000/api/v1/query -H 'Content-Type: application/json' \
            -d '{"question":"How many days of annual leave are employees entitled to?","retriever":"tfidf"}' | grep -q '"answer"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/ask -H 'Content-Type: application/json' -d '{"question":"   "}')" = "422"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/api/v1/query -H 'Content-Type: application/json' -d '{"question":"x"}')" = "422"
          curl -sf http://localhost:8000/metrics | grep -q rag_requests_total


      - name: Container logs on failure
        if: failure()
        run: docker logs ragops
